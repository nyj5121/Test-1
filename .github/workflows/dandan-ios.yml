name: dandan-ios
on:
  push:
    paths:
      - 'dandan-ios/**'
      - '.github/workflows/dandan-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: dandan-ios
        run: xcodegen generate
      - name: Build (unsigned, compile check)
        working-directory: dandan-ios
        run: |
          xcodebuild -project Dandan.xcodeproj -scheme Dandan \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned ipa
        working-directory: dandan-ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Dandan.app Payload/
          zip -qr dandan-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: dandan-ios-unsigned
          path: dandan-ios/dandan-unsigned.ipa
