<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단단 친구 승인</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#171a21; --line:#2a3042; --text:#eceef3; --dim:#a9afc0;
          --acc:#8c9bff; --ok:#6ee7b7; --bad:#ff9a9a; --warn:#ffd28a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 22px 16px 90px; }
  .brand { font-size: 14px; color: var(--dim); }
  h1 { font-size: 27px; line-height: 1.3; margin: 4px 0 12px; }
  h2 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 6px 0; }
  .dim { color: var(--dim); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin: 14px 0; }
  .card.ok { border-color: #1f5a41; background: #11261d; }
  .card.warn { border-color: #5c4516; background: #2a2210; color: var(--warn); }
  .card.bad { border-color: #5c2222; background: #2a1414; color: var(--bad); }
  .big { font-size: 22px; font-weight: 800; line-height: 1.45; }
  .quote { border-left: 4px solid var(--acc); padding: 4px 0 4px 14px; margin: 14px 0 4px; font-size: 18px; }
  .btn { display: block; width: 100%; font: inherit; font-weight: 800; font-size: 18px; border: 0; border-radius: 16px;
         padding: 16px; margin: 10px 0 0; background: var(--acc); color: #0b0e2a; cursor: pointer; }
  .btn.sub { background: #232733; color: var(--text); }
  .btn.no { background: #2b1f22; color: var(--bad); }
  .btn.small { font-size: 15px; padding: 11px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .steps { display: flex; gap: 6px; margin: 10px 0 4px; }
  .dot { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.on { background: var(--acc); }
  .steplabel { font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
  textarea { width: 100%; min-height: 84px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
             color: var(--text); padding: 10px; font: 13px/1.4 ui-monospace, monospace; word-break: break-all; }
  input[type=time] { font: inherit; font-size: 20px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                     border-radius: 12px; padding: 10px 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .chip { font: inherit; font-weight: 700; border: 1px solid var(--line); background: #232733; color: var(--dim);
          border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .chip.on { background: var(--acc); color: #0b0e2a; border-color: var(--acc); }
  .chip.day { width: 39px; height: 39px; padding: 0; font-size: 15px; }
  .chips.days { gap: 5px; flex-wrap: nowrap; }
  .chip.sm { padding: 10px 11px; }
  details { margin-top: 22px; color: var(--dim); font-size: 14px; }
  summary { cursor: pointer; padding: 6px 0; }
  ul { padding-left: 20px; margin: 8px 0; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script src="core.js"></script>
<script>
(function () {
  var C = window.DandanCore;
  var app = document.getElementById('app');
  var KEY = 'dandan_key';

  /* ---------- 작은 도우미 ---------- */
  function h(tag, cls) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c !== null && c !== undefined) e.append(c); }
    return e;
  }
  function btn(label, cls, fn) { var b = h('button', 'btn ' + (cls || ''), label); b.onclick = fn; return b; }
  function now() { return Math.floor(Date.now() / 1000); }
  function leftText(sec) {
    var m = Math.max(1, Math.round(sec / 60));
    if (m < 90) return m + '분';
    return Math.round(m / 60) + '시간';
  }

  function copyText(text, onDone) {
    function fallback() {
      var t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select();
      try { document.execCommand('copy'); } catch (e) {}
      t.remove(); onDone();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(onDone, fallback);
    else fallback();
  }

  function steps(n, labels) {
    var d = h('div', 'steps'), l = h('div', 'steplabel');
    labels.forEach(function (t, i) { d.append(h('div', 'dot' + (i < n ? ' on' : ''))); l.append(h('span', null, t)); });
    return h('div', null, d, l);
  }

  function header(title) { return h('div', null, h('div', 'brand', '단단 · 친구 승인'), h('h1', null, title)); }

  function loadKey() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  async function ensureKey() {
    var k = loadKey();
    if (k && k.priv && k.pub) return k;
    k = await C.generate();
    localStorage.setItem(KEY, JSON.stringify(k));
    return k;
  }

  /* 요청 링크에 실린 임시 주소(t)로 승인 코드를 보낸다. 성공하면 상대 앱이 자동으로 받아서 적용한다. */
  async function deliver(t, code) {
    if (!t || !/^[A-Za-z0-9_-]{8,64}$/.test(t)) return false;
    try {
      var res = await fetch('https://ntfy.sh/' + t, { method: 'POST', body: code });
      return res.ok;
    } catch (e) { return false; }
  }

  /* 같은 요청을 여러 친구에게 보냈을 때: 누가 먼저 답했거나 요청자가 닫았다면 이 링크는 더 못 쓴다.
     임시 주소에 메시지(승인 코드 또는 DONE)가 하나라도 있으면 '처리됨'으로 본다. */
  function validT(t) { return !!t && /^[A-Za-z0-9_-]{8,64}$/.test(t); }
  async function isHandled(t) {
    if (!validT(t)) return false;
    try {
      var res = await fetch('https://ntfy.sh/' + t + '/json?poll=1&since=all');
      if (!res.ok) return false;
      var txt = await res.text();
      return txt.split('\n').some(function (l) {
        try { return JSON.parse(l).event === 'message'; } catch (e) { return false; }
      });
    } catch (e) { return false; }
  }
  var watcher = null;
  function stopWatch() { if (watcher) { watcher.stop(); watcher = null; } }
  function watch(t, onHandled) {
    stopWatch();
    if (!validT(t)) return;
    var stopped = false, iv = null;
    watcher = { stop: function () { stopped = true; if (iv) clearInterval(iv); } };
    async function chk() {
      if (stopped) return;
      if (await isHandled(t) && !stopped) { stopWatch(); onHandled(); }
    }
    iv = setInterval(chk, 10000);
    chk();
  }
  function handledView(who, title) {
    app.replaceChildren(header(title || '이미 처리된 요청'),
      h('div', 'card', h('h2', null, '이미 처리됐어요'),
        h('p', null, '다른 친구가 먼저 답했거나 ' + who + '님이 요청을 닫았어요. 이 링크는 더 쓸 수 없어요.'),
        h('p', 'dim', '더 해 줄 일은 없어요.')));
  }

  function deliveredCard(title, text, code) {
    var card = h('div', 'card ok', h('h2', null, title), h('p', null, text));
    card.append(h('details', null, h('summary', null, '전달이 안 됐다면 코드를 직접 보내기'), h('textarea', null, code)));
    return card;
  }

  function inApp() { return /KAKAOTALK|FBAN|FBAV|Instagram|NAVER\(inapp|Line\//i.test(navigator.userAgent); }

  /* 코드를 보내는 카드: 공유 버튼 + 복사 버튼. 코드만 그대로 보내야 앱이 읽을 수 있다. */
  function sendCard(title, code, hint) {
    var copyBtn = btn('코드 복사하기', 'sub', function () {
      copyText(code, function () { copyBtn.textContent = '복사했어요 ✓'; setTimeout(function () { copyBtn.textContent = '코드 복사하기'; }, 1800); });
    });
    var card = h('div', 'card ok', h('h2', null, title), h('p', null, hint));
    if (navigator.share) {
      card.append(btn('카톡·문자로 보내기', '', function () { navigator.share({ text: code }).catch(function () {}); }));
    }
    card.append(copyBtn);
    card.append(h('details', null, h('summary', null, '코드 직접 보기'), h('textarea', null, code)));
    copyText(code, function () {});
    return card;
  }

  function backupBox() {
    var d = h('details', null, h('summary', null, '고급: 열쇠 백업·복원 (폰을 바꾸거나 브라우저 기록을 지울 때)'));
    var k = loadKey();
    if (k) {
      var code = C.b64u.enc(C.enc.encode(JSON.stringify(k)));
      var ta = h('textarea', null, code); ta.readOnly = true;
      d.append(h('p', null, '이 코드를 나만 아는 곳에 보관하세요. 이 코드가 있으면 승인 권한을 되살릴 수 있어요. 다른 사람에게 보이면 안 돼요.'), ta);
    }
    var rt = h('textarea'); rt.placeholder = '백업 코드를 여기에 붙여넣기';
    var rb = btn('복원하기', 'sub small', async function () {
      try {
        var o = JSON.parse(C.dec.decode(C.b64u.dec(rt.value)));
        await C.spki(o.pub); await C.sign(o.priv, 'test');
        localStorage.setItem(KEY, JSON.stringify(o));
        rb.textContent = '복원했어요 ✓'; setTimeout(render, 700);
      } catch (e) { rb.textContent = '코드가 올바르지 않아요'; }
    });
    d.append(h('p', null, '복원하기'), rt, rb);
    return d;
  }

  function noKeyCard(who) {
    return h('div', 'card warn', h('h2', null, '먼저 친구 연결이 필요해요'),
      h('p', null, '이 브라우저에는 아직 친구 연결이 없어요. ' + who + '님이 보낸 "친구 초대" 링크를 먼저 열어서 "친구 되어 주기"를 눌러 주세요. 예전에 연결했는데 이 화면이 나온다면 아래 백업으로 복원하세요.'));
  }

  /* ---------- 1) 친구 초대 ---------- */
  async function renderHome(from, t) {
    var who = from || '친구';
    app.append(header(from !== null ? who + '님의 친구가 되어 주세요' : '친구 되어 주기'));
    app.append(h('div', 'card',
      h('p', 'big', '친구가 되면 이런 일을 해요'),
      h('ul', null,
        h('li', null, who + '님이 잠금을 풀고 싶을 때 보내는 부탁을 받아요.'),
        h('li', null, '사유를 읽고, 풀어 줄지 말지 직접 정해요.'),
        h('li', null, '풀어 주면 "승인 코드"가 만들어지고, 그걸 ' + who + '님에게 보내 줘요.')),
      h('p', 'dim', '앱 설치도, 로그인도 필요 없어요. 이 브라우저에서만 해요.')));

    var holder = h('div');
    async function show() {
      var k = await ensureKey();
      var pk = await C.spki(k.pub);
      if (await deliver(t, pk)) {
        holder.replaceChildren(steps(2, ['친구 되기', '완료']),
          deliveredCard('친구가 됐어요 ✓', who + '님 폰에 자동으로 전달됐어요. 더 할 일은 없어요.', pk));
      } else {
        holder.replaceChildren(
          steps(2, ['친구 되기', '코드 보내기']),
          sendCard('내 연결 코드', pk,
            '이 코드를 ' + who + '님에게 보내 주세요. 공개해도 안전한 코드예요. 보내면 끝이에요.'));
      }
    }
    if (loadKey()) await show();
    else app.append(btn('친구 되어 주기', '', async function () {
      try { await show(); this.remove(); } catch (e) { holder.replaceChildren(h('div', 'card bad', '열쇠를 만들 수 없어요. 크롬이나 사파리 같은 일반 브라우저에서 열어 주세요.')); }
    }));
    app.append(holder, backupBox());
  }

  /* ---------- 2) 승인 요청 ---------- */
  function renderRequest(r, t) {
    var text;
    try { text = C.dec.decode(C.b64u.dec(r)); } catch (e) { text = null; }
    var q = text && C.parseReq(text);
    app.append(header('부탁이 왔어요'));
    if (!q) { app.append(h('div', 'card bad', '요청 링크가 올바르지 않아요. 링크를 다시 받아 주세요.')); return; }
    var who = q.from || '친구';
    var left = q.exp - now();
    if (left <= 0) { app.append(h('div', 'card bad', '이 요청은 시간이 지났어요. ' + who + '님에게 새 링크를 보내 달라고 하세요.')); return; }

    var labels = ['확인', '승인', '보내기'];
    var stepBox = h('div'); stepBox.append(steps(1, labels));
    var main = h('div', 'card',
      h('p', 'big', C.describe(q)),
      h('div', 'quote', q.reason ? q.reason : '(사유를 적지 않았어요)'),
      h('p', 'dim', leftText(left) + ' 안에 답해 주세요'));
    app.append(stepBox, main);
    if (!loadKey()) { app.append(noKeyCard(who), backupBox()); return; }

    var area = h('div');
    app.append(area);
    function ask() {
      area.replaceChildren(
        btn('승인할게요', '', confirmStep),
        btn('거절할게요', 'no', function () {
          stepBox.replaceChildren(steps(1, labels));
          area.replaceChildren(h('div', 'card', h('h2', null, '거절했어요'), h('p', null, '아무 코드도 만들어지지 않았고, ' + who + '님의 잠금은 그대로예요.')));
        }));
    }
    function confirmStep() {
      stepBox.replaceChildren(steps(2, labels));
      area.replaceChildren(
        h('div', 'card warn', h('h2', null, '정말 풀어 줄까요?'),
          h('p', null, '승인하면 ' + who + '님의 잠금이 풀려요. 사유가 충분한지 한 번 더 생각해 보세요.')),
        btn('네, 승인할게요', '', approve),
        btn('다시 생각할게요', 'sub', function () { stepBox.replaceChildren(steps(1, labels)); ask(); }));
    }
    async function approve() {
      stopWatch();
      if (await isHandled(t)) { handledView(who); return; }
      try {
        var k = loadKey();
        var code = await C.sign(k.priv, text);
        stepBox.replaceChildren(steps(3, labels));
        if (await deliver(t, code)) {
          area.replaceChildren(deliveredCard('승인했어요 ✓', who + '님 폰에 자동으로 전달됐어요. 더 할 일은 없어요.', code));
        } else {
          area.replaceChildren(sendCard('승인 코드가 만들어졌어요', code,
            '자동 전달이 안 됐어요. ' + who + '님에게 이 코드를 직접 보내 주세요. 이 요청에만 쓸 수 있고, 유효시간 안에 써야 해요.'));
        }
      } catch (e) { area.replaceChildren(h('div', 'card bad', '코드를 만들 수 없어요. 일반 브라우저에서 다시 열어 주세요.')); }
    }
    ask();
    watch(t, function () { handledView(who); });
  }

  /* ---------- 3) 바보폰 자유 시간 정하기 ---------- */
  function renderPolicy(qParam, t) {
    var text;
    try { text = C.dec.decode(C.b64u.dec(qParam)); } catch (e) { text = null; }
    var q = text && C.parseQ(text);
    app.append(header('자유 시간 정하기'));
    if (!q) { app.append(h('div', 'card bad', '요청 링크가 올바르지 않아요. 링크를 다시 받아 주세요.')); return; }
    var who = q.from || '친구';
    app.append(h('div', 'card',
      h('p', 'big', who + '님이 바보폰에서 벗어날 시간을 정해 달래요'),
      h('div', 'quote', q.reason ? q.reason : '(사유를 적지 않았어요)'),
      h('p', 'dim', '여기서 정한 시간에만 ' + who + '님이 폰을 평소처럼 써요. 그 밖의 시간은 하루 종일 바보폰이에요.')));
    if (!loadKey()) { app.append(noKeyCard(who), backupBox()); return; }

    var rows = C.parseWins(q.wins);
    var list = h('div');
    var DAYS = ['월', '화', '수', '목', '금', '토', '일'];
    function draw() {
      list.replaceChildren();
      if (!rows.length) list.append(h('div', 'card', h('p', null, '자유 시간이 없어요.'), h('p', 'dim', '이대로 승인하면 하루 종일 바보폰이에요.')));
      rows.forEach(function (r, idx) {
        var s = h('input'); s.type = 'time'; s.value = r.s; s.onchange = function () { r.s = s.value; };
        var e = h('input'); e.type = 'time'; e.value = r.e; e.onchange = function () { r.e = e.value; };
        var days = h('div', 'chips days');
        DAYS.forEach(function (d, i) {
          var c = h('button', 'chip day' + (((r.d >> i) & 1) ? ' on' : ''), d);
          c.onclick = function () { r.d ^= (1 << i); draw(); };
          days.append(c);
        });
        list.append(h('div', 'card',
          h('div', 'row', s, h('span', 'dim', '부터'), e, h('span', 'dim', '까지')),
          days,
          btn('이 시간대 지우기', 'sub small', function () { rows.splice(idx, 1); draw(); })));
      });
    }
    draw();

    var presets = h('div', 'card', h('h2', null, '빠르게 추가'), h('div', 'chips'));
    [['평일 저녁 1시간', '19:00', '20:00', 31], ['매일 저녁 1시간', '20:00', '21:00', 127],
     ['주말 낮 2시간', '13:00', '15:00', 96], ['매일 점심 30분', '12:00', '12:30', 127]].forEach(function (p) {
      var c = h('button', 'chip', p[0]);
      c.onclick = function () { if (rows.length < 8) { rows.push({ s: p[1], e: p[2], d: p[3] }); draw(); } };
      presets.lastChild.append(c);
    });
    presets.append(btn('+ 직접 시간대 추가', 'sub small', function () { if (rows.length < 8) { rows.push({ s: '20:00', e: '21:00', d: 127 }); draw(); } }));

    var days = 7;
    var validity = h('div', 'card', h('h2', null, '이 설정은 얼마 동안 유효할까요?'),
      h('p', 'dim', '기간이 끝나면 자유 시간이 사라지고 하루 종일 바보폰이 돼요. 그 전에 다시 정해 주세요.'));
    var vchips = h('div', 'chips');
    [1, 3, 7, 14, 30].forEach(function (d) {
      var c = h('button', 'chip sm' + (d === days ? ' on' : ''), d + '일');
      c.onclick = function () { days = d; Array.prototype.forEach.call(vchips.children, function (x) { x.classList.remove('on'); }); c.classList.add('on'); };
      vchips.append(c);
    });
    validity.append(vchips);

    var out = h('div');
    var go = btn('이대로 승인할게요', '', async function () {
      stopWatch();
      if (await isHandled(t)) { handledView(who, '자유 시간 정하기'); return; }
      try {
        var good = rows.filter(function (r) { return r.s && r.e && r.s !== r.e && (r.d & 127); });
        var ver = now(), exp = ver + days * 86400;
        var policy = ['p1', q.dev, ver, exp, C.encodeWins(good), q.from].join('|');
        var code = await C.signPolicy(loadKey().priv, policy);
        if (await deliver(t, code)) {
          out.replaceChildren(deliveredCard('정했어요 ✓', who + '님 폰에 자동으로 전달돼서 바로 적용돼요. 더 할 일은 없어요.', code));
        } else {
          out.replaceChildren(sendCard('코드가 만들어졌어요', code,
            '자동 전달이 안 됐어요. ' + who + '님에게 이 코드를 직접 보내 주세요. 시간대와 유효기간이 들어 있어요. 이 폰에서만 쓸 수 있어요.'));
        }
        go.disabled = true;
      } catch (e) { out.replaceChildren(h('div', 'card bad', '코드를 만들 수 없어요. 일반 브라우저에서 다시 열어 주세요.')); }
    });
    app.append(list, presets, validity, go, out);
    watch(t, function () { handledView(who, '자유 시간 정하기'); });
  }

  function render() {
    stopWatch();
    app.replaceChildren();
    if (inApp()) app.append(h('div', 'card warn', '앱 안의 브라우저로 열린 것 같아요. 연결 정보가 저장되지 않을 수 있으니, 오른쪽 위 메뉴의 "다른 브라우저로 열기"로 크롬이나 사파리에서 열어 주세요.'));
    var q = new URLSearchParams(location.hash.replace(/^#/, ''));
    var r = q.get('r'), pq = q.get('q'), t = q.get('t');
    if (r) renderRequest(r, t);
    else if (pq) renderPolicy(pq, t);
    else renderHome(q.has('hello') ? (q.get('from') || '') : null, t);
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
