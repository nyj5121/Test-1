name: Dandan
options:
  bundleIdPrefix: app.dandan
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dandan:
    type: application
    platform: iOS
    sources: [Dandan]
    dependencies:
      - target: DandanMonitor
    entitlements:
      path: Dandan/Dandan.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: Dandan/Info.plist
      properties:
        CFBundleDisplayName: 단단
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dandan.ios
  DandanMonitor:
    type: app-extension
    platform: iOS
    sources: [DandanMonitor]
    entitlements:
      path: DandanMonitor/DandanMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: DandanMonitor/Info.plist
      properties:
        CFBundleDisplayName: 단단 모니터
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DandanMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dandan.ios.monitor
schemes:
  Dandan:
    build:
      targets:
        Dandan: all
